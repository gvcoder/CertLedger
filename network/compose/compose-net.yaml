# ---------------------------------------------------------------------------
# CertLedger - Ordering service + peers
#
#   orderer.certledger.com          Raft orderer (OrdererMSP)       7050 / admin 7053 / ops 9443
#   peer0.university.certledger.com UniversityMSP peer              7051 / ops 9444
#   peer0.platform.certledger.com   PlatformMSP peer                9051 / ops 9445
#
# Ledger data lives in *named volumes*, so `network.sh down` keeps your blocks
# and `network.sh clean` wipes them.
# ---------------------------------------------------------------------------
networks:
  fabric:
    name: certledger_fabric

volumes:
  orderer.certledger.com:
  peer0.university.certledger.com:
  peer0.platform.certledger.com:

x-peer-common: &peer-common
  image: hyperledger/fabric-peer:${FABRIC_VERSION}
  working_dir: /root
  command: peer node start
  networks: [fabric]

x-peer-env: &peer-env
  FABRIC_CFG_PATH: /etc/hyperledger/peercfg
  # Runtime-adjustable via:  ./network/network.sh loglevel <peer> <spec>
  FABRIC_LOGGING_SPEC: ${PEER_LOGGING_SPEC:-INFO}
  CORE_PEER_TLS_ENABLED: "true"
  CORE_PEER_PROFILE_ENABLED: "false"
  CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
  CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
  CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
  CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
  CORE_METRICS_PROVIDER: prometheus
  # Standard chaincode lifecycle: the peer builds & launches chaincode
  # containers through the host Docker daemon.
  CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
  CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: certledger_fabric
  CORE_CHAINCODE_EXECUTETIMEOUT: 300s
  # Log level *inside* the chaincode container (your contract's logger)
  CORE_CHAINCODE_LOGGING_LEVEL: ${CHAINCODE_LOGGING_LEVEL:-info}
  CORE_CHAINCODE_LOGGING_SHIM: warning
  # World state in CouchDB (rich JSON queries + Fauxton UI)
  CORE_LEDGER_STATE_STATEDATABASE: CouchDB
  CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: admin
  CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: adminpw

services:

  orderer.certledger.com:
    image: hyperledger/fabric-orderer:${FABRIC_VERSION}
    container_name: orderer.certledger.com
    environment:
      FABRIC_LOGGING_SPEC: ${ORDERER_LOGGING_SPEC:-INFO}
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: "7050"
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      # No system channel: channels are created with the channel participation API (osnadmin)
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
      ORDERER_METRICS_PROVIDER: prometheus
    working_dir: /root
    command: orderer
    ports:
      - "7050:7050"
      - "7053:7053"
      - "9443:9443"
    volumes:
      - ../organizations/ordererOrganizations/certledger.com/orderers/orderer.certledger.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/certledger.com/orderers/orderer.certledger.com/tls:/var/hyperledger/orderer/tls
      - orderer.certledger.com:/var/hyperledger/production/orderer
    networks: [fabric]

  peer0.university.certledger.com:
    <<: *peer-common
    container_name: peer0.university.certledger.com
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.university.certledger.com
      CORE_PEER_ADDRESS: peer0.university.certledger.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.university.certledger.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.university.certledger.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.university.certledger.com:7051
      CORE_PEER_LOCALMSPID: UniversityMSP
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.university:5984
    ports:
      - "7051:7051"
      - "9444:9444"
    volumes:
      - ../config:/etc/hyperledger/peercfg
      - ../organizations/peerOrganizations/university.certledger.com/peers/peer0.university.certledger.com:/etc/hyperledger/fabric
      - peer0.university.certledger.com:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
    depends_on:
      - couchdb.university

  peer0.platform.certledger.com:
    <<: *peer-common
    container_name: peer0.platform.certledger.com
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.platform.certledger.com
      CORE_PEER_ADDRESS: peer0.platform.certledger.com:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.platform.certledger.com:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.platform.certledger.com:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.platform.certledger.com:9051
      CORE_PEER_LOCALMSPID: PlatformMSP
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9445
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.platform:5984
    ports:
      - "9051:9051"
      - "9445:9445"
    volumes:
      - ../config:/etc/hyperledger/peercfg
      - ../organizations/peerOrganizations/platform.certledger.com/peers/peer0.platform.certledger.com:/etc/hyperledger/fabric
      - peer0.platform.certledger.com:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
    depends_on:
      - couchdb.platform
